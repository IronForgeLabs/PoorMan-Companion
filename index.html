const fresh=()=>({schemaVersion:VERSION,profile:{complete:false,goals:['general'],level:'beginner',gear:['bodyweight','none'],exclusions:[],days:[1,3,5],minutes:30,units:'lb',theme:'dark'},plan:null,sessions:[],body:[],nutrition:[],recovery:[],photos:[],goals:{sessions:3,minutes:150},active:null,legacyImported:false});
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDB(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function writeDB(value){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(value,KEY);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
let saving=Promise.resolve();function save(){state.schemaVersion=VERSION;let snap=structuredClone(state);saving=saving.catch(()=>{}).then(()=>writeDB(snap)).catch(e=>alert('Storage failed. Export a backup soon: '+e.message));return saving}
function gearAllowed(ex){return ex.gear==='none'||ex.gear==='bodyweight'||state.profile.gear.includes(ex.gear)}
function substitute(id){let old=E(id);return EX.filter(x=>x.id!==id&&x.type===old.type&&x.muscle===old.muscle&&gearAllowed(x)&&!state.profile.exclusions.includes(x.id)).slice(0,6)}

function makePlan(type='mixed'){let t=templates[type]||templates.mixed,days=state.profile.days,dose=recommendedDose();return {id:uid(),template:type,name:t.name,weekdays:[...days],sessions:days.map((wd,i)=>({id:uid(),weekday:wd,name:t.name+' '+(i+1),exercises:t.sessions[i%t.sessions.length].map(chooseExercise),sets:dose.sets,reps:dose.reps,rest:dose.rest})),createdAt:iso()}}
function nav(){document.getElementById('nav').innerHTML=['Today','Plan','Activities','Progress','Settings'].map(x=>`<button class="${tab===x?'active':''}" onclick="go('${x}')" aria-label="${x}"><span class="navicon">${{Today:'⌂',Plan:'▦',Activities:'◉',Progress:'▥',Settings:'☰'}[x]}</span><span>${{Today:'Home',Plan:'Workouts',Activities:'Activities',Progress:'Progress',Settings:'More'}[x]}</span></button>`).join('')}

function onboarding(){let p=state.profile;return `<div class="card"><div class="eyebrow">WELCOME TO POORMAN COMPANION</div><h2>Built around your goals.</h2><p class="muted">Set up your fitness experience. Everything is editable later. No account required.</p><form onsubmit="setup(event)"><h3>Your goals</h3>${checkboxes('goals',[['fatloss','Fat loss'],['muscle','Build muscle'],['strength','Get stronger'],['endurance','Endurance'],['mobility','Mobility'],['general','General fitness']],p.goals)}<label>Experience<select name="level"><option>beginner</option><option>intermediate</option><option>advanced</option></select></label><h3>Available equipment</h3>${checkboxes('gear',[['bodyweight','Bodyweight'],['dumbbells','Dumbbells'],['bands','Bands'],['barbell','Barbell'],['machines','Machines'],['cables','Cables'],['bike','Bike'],['pool','Pool'],['rower','Rower']],p.gear)}<h3>Training days</h3>${checkboxes('days',weekdays.map((x,i)=>[String(i),x]),p.days.map(String))}<div class="grid"><label>Minutes per session<input name="minutes" type="number" min="10" max="180" value="${p.minutes}" required></label><label>Units<select name="units"><option value="lb">Pounds / miles</option><option value="kg">Kilograms / km</option></select></label><label>Recommended plan<select name="template">${Object.entries(templates).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select></label></div><button class="primary" type="submit">Create my plan</button></form></div>`}
function setup(ev){ev.preventDefault();let f=ev.target,p=state.profile,days=selected('days').map(Number).sort((a,b)=>a-b);if(!days.length)return alert('Select at least one training day.');p.goals=selected('goals');p.level=f.level.value;p.gear=selected('gear');p.days=days;p.minutes=clamp(num(f.minutes.value,30),10,180);p.units=f.units.value;p.complete=true;state.plan=makePlan(f.template.value);save();go('Today')}
function thisWeek(){let n=new Date(),d=n.getDay(),start=new Date(n);start.setDate(n.getDate()-((d+6)%7));start.setHours(0,0,0,0);return start}

function nextSession(){if(!state.plan)return null;let todayDay=new Date().getDay();return state.plan.sessions.find(x=>x.weekday===todayDay)||state.plan.sessions.find(x=>x.weekday>todayDay)||state.plan.sessions[0]}
function today(){let n=nextSession(),done=completedThisWeek(),target=state.plan?.sessions.length||0,stats=weekStats(),pct=target?Math.min(100,Math.round(done/target*100)):0;return `<div class="compact-home"><div class="feature-hero card"><div class="eyebrow">TODAY'S NEXT STEP</div><div class="hero-content"><div><h2>${n?esc(n.name):'Ready to get moving?'}</h2><p class="muted">${n?`${n.exercises.length} exercises · about ${state.profile.minutes} min`:'Build a plan that fits your life.'}</p><button class="primary" onclick="${state.active?"go('Log')":n?"startPlan('"+n.id+"')":"go('Plan')"}">${state.active?'▶ Resume workout':n?'▶ Start workout':'✦ Create my plan'}</button></div><div class="progress-dial" style="--dial:${pct}%" aria-label="${pct}% of weekly workout goal"><span>${pct}%</span></div></div></div><div class="home-actions"><button onclick="go('Activities')"><span style="font-size:1.6rem">🚶</span><b>Log activity</b><small>Walk, run, ride</small></button><button onclick="go('Explore')"><span style="font-size:1.6rem">📖</span><b>Exercise guides</b><small>Pictures + steps</small></button><button onclick="go('Progress')"><span style="font-size:1.6rem">📈</span><b>My progress</b><small>Goals and trends</small></button><button onclick="go('Plan')"><span style="font-size:1.6rem">🗓️</span><b>My plan</b><small>View schedule</small></button></div></div><div class="section-heading"><h2>This week</h2><span class="pill">Every step counts</span></div><div class="home-stats"><div><b>${done}/${target}</b><small class="muted">Workouts</small></div><div><b>${Math.round(stats.minutes)}</b><small class="muted">Active minutes</small></div><div><b>${state.sessions.filter(x=>x.status==='done').length}</b><small class="muted">Total sessions</small></div></div>${state.active?`<div class="card notice"><b>Workout in progress</b><p>${esc(state.active.name)}</p><button class="primary" onclick="go('Log')">Continue</button></div>`:''}`}

function planView(){let p=state.profile,pl=state.plan;return `<div class="feature-hero card"><div class="eyebrow">YOUR TRAINING SPACE</div><h2>Find your rhythm.</h2><p class="muted">Choose your days, train with your equipment, and make each workout yours.</p><div class="row"><button class="primary" onclick="go('Log')">Open workout logger</button><button onclick="go('Explore')">Exercise guides</button></div></div><div class="section-heading"><h2>Your weekly workouts</h2><span class="pill">${pl?.sessions.length||0} days planned</span></div><div class="session-grid">${(pl?.sessions||[]).map((s,i)=>`<div class="session-card"><span class="session-icon">${['🏋️','💪','⚡','🎯'][i%4]}</span><span class="section-tag">${weekdays[s.weekday]}</span><h3>${esc(s.name)}</h3><p class="muted tiny">${s.exercises.length} exercises · ${p.minutes} min target</p><p class="program-note tiny">Each strength exercise: ${s.sets||recommendedDose().sets} sets × ${esc(s.reps||recommendedDose().reps)} reps · rest ${esc(s.rest||recommendedDose().rest)}</p><p class="muted tiny">${s.exercises.slice(0,2).map(id=>`<button style="padding:5px 8px;font-size:.75rem" onclick="openGuide('${id}')">${esc(E(id).name)} ↗</button>`).join(' ')}${s.exercises.length>2?' + more':''}</p><button class="primary" onclick="startPlan('${s.id}')">Start workout</button><div class="row"><button onclick="editPlanSession(${i})">Edit</button><button onclick="moveSession(${i})">Move day</button></div></div>`).join('')||'<div class="card">No plan yet. Create one below.</div>'}</div><div class="card"><div class="eyebrow">MAKE IT YOURS</div><h2>Customize your plan</h2><p class="muted">Your completed workouts are never removed when you change your schedule.</p><label>Program<select id="template">${Object.entries(templates).map(([k,v])=>`<option value="${k}" ${pl?.template===k?'selected':''}>${v.name}</option>`).join('')}</select></label><label>Which days work for you?</label>${checkboxes('planDays',weekdays.map((x,i)=>[String(i),x]),p.days.map(String))}<label>Minutes per workout<input id="minutes" type="number" min="10" max="180" value="${p.minutes}"></label><button class="primary" onclick="applyPlan()">Generate my plan</button></div>`}

function applyPlan(){let days=selected('planDays').map(Number).sort((a,b)=>a-b);if(!days.length)return alert('Choose at least one day.');if(!confirm('Replace your current schedule? Completed workouts stay saved.'))return;state.profile.days=days;state.profile.minutes=clamp(num(document.getElementById('minutes').value,30),10,180);state.plan=makePlan(document.getElementById('template').value);save();render()}
function moveSession(i){let s=state.plan.sessions[i],v=prompt('New weekday: 0 Sunday, 1 Monday, ... 6 Saturday',s.weekday);if(v===null)return;let d=Number(v);if(!Number.isInteger(d)||d<0||d>6)return alert('Enter 0–6.');s.weekday=d;save();render()}
function editPlanSession(i){let s=state.plan.sessions[i];let names=EX.filter(x=>x.type==='strength'&&gearAllowed(x)&&!state.profile.exclusions.includes(x.id));let options=names.map(x=>`${x.id}: ${x.name}`).join('\n');let q=prompt('Enter exercise IDs separated by commas. Available options:\n'+options,s.exercises.join(','));if(q===null)return;let ids=q.split(',').map(x=>x.trim()).filter(Boolean);if(!ids.length||ids.some(id=>!EX.some(e=>e.id===id)))return alert('Choose valid exercise IDs from the list.');s.exercises=ids;save();render()}
function startPlan(id){let s=state.plan?.sessions.find(x=>x.id===id);if(!s)return;if(state.active&&!confirm('Replace unfinished session?'))return;let dose={sets:s.sets||recommendedDose().sets,reps:s.reps||recommendedDose().reps,rest:s.rest||recommendedDose().rest};state.active={id:uid(),name:s.name,planSessionId:id,startedAt:iso(),type:'mixed',targetSets:dose.sets,targetReps:dose.reps,rest:dose.rest,exercises:s.exercises.map(x=>({id:x,targetSets:dose.sets,targetReps:dose.reps,sets:E(x).type==='strength'?Array.from({length:dose.sets},()=>({weight:'',reps:'',done:false})):[],minutes:'',distance:''})),notes:''};save();go('Log')}
function startManual(){if(state.active&&!confirm('Replace unfinished session?'))return;state.active={id:uid(),name:'Manual activity',startedAt:iso(),type:'cardio',exercises:[{id:'walk',sets:[],minutes:'',distance:''}],notes:''};save();go('Log')}

function logView(){let a=state.active;return a?`<div class="card"><div class="row between"><h2>${esc(a.name)}</h2><span class="pill">Autosaved</span></div><p class="muted tiny">Started ${new Date(a.startedAt).toLocaleString()}</p><label>Session name<input id="sessionName" value="${esc(a.name)}" onchange="updateActive()"></label>${a.exercises.map((x,i)=>{let e=E(x.id);return `<div class="listitem"><div class="row between"><div class="exercise-visual">${guideThumb(e.id)}<div><b>${esc(e.name)}</b><button onclick="openGuide('${e.id}')">📖 How to do it</button></div></div><button onclick="swap(${i})">Swap</button></div><p class="muted tiny">${esc(e.instructions)}</p>${e.type==='strength'?`<div class="program-note tiny"><b>Recommended:</b> ${x.targetSets||a.targetSets||recommendedDose().sets} sets × ${esc(x.targetReps||a.targetReps||recommendedDose().reps)} reps. Start near the low end with a weight you can control; finish each set with about 2–3 good reps left. Rest ${esc(a.rest||recommendedDose().rest)}.</div><div class="sets muted tiny"><span>Set</span><span>Weight (${state.profile.units})</span><span>Reps</span><span>Done</span></div>${x.sets.map((set,j)=>`<div class="sets"><span>${j+1}</span><input type="number" min="0" step="0.5" aria-label="Set ${j+1} weight" value="${esc(set.weight)}" onchange="setField(${i},${j},'weight',this.value)"><input type="number" min="0" step="1" aria-label="Set ${j+1} reps" value="${esc(set.reps)}" onchange="setField(${i},${j},'reps',this.value)"><input type="checkbox" aria-label="Set ${j+1} complete" ${set.done?'checked':''} onchange="setField(${i},${j},'done',this.checked)"></div>`).join('')}<button onclick="addSet(${i})">+ Set</button>`:`<div class="grid"><label>Minutes<input type="number" min="0" step="1" value="${esc(x.minutes)}" onchange="activityField(${i},'minutes',this.value)"></label><label>Distance (${state.profile.units==='lb'?'miles':'km'})<input type="number" min="0" step="0.01" value="${esc(x.distance)}" onchange="activityField(${i},'distance',this.value)"></label></div>`}</div>`}).join('')}<div class="row"><button onclick="addExercise()">+ Exercise / activity</button><button onclick="startRest(90)">Rest 90s</button><button onclick="startRest(180)">Rest 3m</button><button onclick="stopRest()">Stop timer</button><span id="restDisplay" class="pill">Rest timer off</span></div><label>Notes<textarea id="sessionNotes" onchange="updateActive()">${esc(a.notes)}</textarea></label><div class="row"><button class="primary" onclick="finishSession()">Finish workout</button><button class="danger" onclick="discardActive()">Discard</button></div></div>`:`<div class="card"><h2>Activity log</h2><p class="muted">Start a scheduled workout or log any activity.</p><button class="primary" onclick="startManual()">Start manual activity</button> <button onclick="go('Plan')">Choose a workout</button></div>`;

function updateActive(){state.active.name=document.getElementById('sessionName').value;state.active.notes=document.getElementById('sessionNotes').value;save()}

function addToPlan(id){if(!state.plan)return alert('Create a plan first.');let n=state.plan.sessions.map((s,i)=>`${i+1}: ${s.name}`).join('\n'),i=Number(prompt('Add to which workout?\n'+n,'1'))-1;if(!state.plan.sessions[i])return;state.plan.sessions[i].exercises.push(id);save();alert('Added to '+state.plan.sessions[i].name)}
function trend(vals){if(vals.length<2)return '<p class="muted tiny">Add at least two entries to see a trend.</p>';let min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,pts=vals.map((v,i)=>`${10+i*280/(vals.length-1)},${125-(v-min)/range*105}`).join(' ');return `<svg class="chart" viewBox="0 0 300 140" role="img" aria-label="Trend chart"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function progress(){let weights=state.body.filter(x=>x.weightKg!=null),sessions=state.sessions.slice().reverse();let total=sessions.reduce((a,s)=>a+num(s.durationMinutes),0),distance=sessions.reduce((a,s)=>a+s.exercises.reduce((b,x)=>b+num(x.distance),0),0);let prs={};sessions.forEach(s=>s.exercises.forEach(x=>x.sets?.forEach(set=>{if(set.done&&num(set.weight)>num(prs[x.id]))prs[x.id]=num(set.weight)})));return `<div class="feature-hero card"><div class="eyebrow">YOUR JOURNEY</div><h2>Look how far you’ve come.</h2><p class="muted">Every session is progress. Explore your stats, milestones and trends below.</p></div><div class="progress-visual"><div class="card"><h3>Completed workouts</h3><div class="metric">${sessions.length}</div></div><div class="card"><h3>Activity minutes</h3><div class="metric">${total}</div></div><div class="card"><h3>Logged distance</h3><div class="metric">${distance.toFixed(1)} ${state.profile.units==='lb'?'mi':'km'}</div></div><div class="card"><h3>Strength PRs</h3><div class="metric">${Object.keys(prs).length}</div></div></div><div class="card"><h2>Body measurements</h2><div class="grid"><label>Weight (${state.profile.units})<input id="weight" type="number" min="0" step="0.1" placeholder="Optional"></label><label>Waist (${state.profile.units==='lb'?'in':'cm'})<input id="waist" type="number" min="0" step="0.1" placeholder="Optional"></label></div><button onclick="addBody()">Save measurement</button>${trend(weights.slice(-20).map(x=>x.weightKg))}<p class="muted tiny">${weights.length?`Latest: ${(weights.at(-1).weightKg*(state.profile.units==='lb'?2.20462262:1)).toFixed(1)} ${state.profile.units}`:'No measurements yet'}</p></div><div class="card"><h2>Progress photos (optional)</h2><p class="muted tiny">Photos stay in this browser, consume device storage, and are included in exported backups.</p><input type="file" id="photoInput" accept="image/*"><button onclick="addPhoto()">Save photo</button><div class="row" style="margin-top:12px">${state.photos.map(p=>`<div><img class="photo" alt="Progress photo" src="${p.data}"><br><button class="danger" onclick="removePhoto('${p.id}')">Delete</button></div>`).join('')}</div></div><div class="card"><h2>Recovery check-in</h2><div class="grid">${[['energy','Energy'],['sleep','Sleep quality'],['soreness','Soreness']].map(([id,title])=>`<label>${title} (1–5)<select id="${id}">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></label>`).join('')}</div><button onclick="addRecovery()">Save check-in</button>${state.recovery.length?`<p class="muted">Latest: ${esc(recoveryAdvice(state.recovery.at(-1)))}</p>`:''}</div><div class="card"><h2>Protein, water & habits</h2><div class="grid"><label>Protein (grams)<input type="number" id="protein" min="0"></label><label>Water (${state.profile.units==='lb'?'fl oz':'mL'})<input type="number" id="water" min="0"></label></div><label><input id="habit" type="checkbox"> I completed my daily movement goal</label><button onclick="addNutrition()">Save today</button><p class="muted tiny">Optional habit tracking. No mandatory calorie counting.</p></div><div class="card"><h2>Achievements</h2><div class="row">${[1,5,10,25,50,100].map(n=>`<span class="pill" style="opacity:${sessions.length>=n?1:.35}">🏅 ${n} workouts</span>`).join('')}</div><p class="muted tiny">Milestones are based on completed sessions; rest days do not reset progress.</p></div><div class="card"><h2>Progression suggestions</h2>${Object.entries(prs).slice(0,12).map(([id,n])=>{let recent=sessions.flatMap(s=>s.exercises.filter(x=>x.id===id).flatMap(x=>x.sets||[])).filter(x=>x.done).slice(0,3);let ready=recent.length>=3&&recent.every(x=>num(x.reps)>=12);return `<div class="listitem"><b>${esc(E(id).name)}</b><p class="muted tiny">${ready?'You recently completed 12+ reps across 3 sets. Consider a small weight increase next time if technique feels solid.':'Keep practicing at a manageable weight; build reps with good form.'} No automatic changes.</p></div>`}).join('')||'<p class="muted">Log strength sets to see suggestions.</p>'}</div><div class="card"><h2>Personal records</h2>${Object.entries(prs).slice(0,20).map(([id,n])=>`<div class="listitem">${esc(E(id).name)}: ${n} ${state.profile.units}</div>`).join('')||'<p class="muted">Complete strength sets to earn records.</p>'}</div><div class="card"><h2>Workout history</h2>${sessions.slice(0,40).map(s=>`<div class="listitem"><b>${esc(s.name)}</b> <span class="muted tiny">${new Date(s.startedAt).toLocaleDateString()} · ${s.durationMinutes} min</span><button class="danger" onclick="deleteSession('${s.id}')">Delete</button></div>`).join('')||'<p class="muted">No completed sessions yet.</p>'}</div>`}
function addBody(){let w=document.getElementById('weight').value,wa=document.getElementById('waist').value;if(!w&&!wa)return alert('Enter a measurement.');state.body.push({id:uid(),at:iso(),weightKg:w?num(w)/(state.profile.units==='lb'?2.20462262:1):null,waistCm:wa?num(wa)*(state.profile.units==='lb'?2.54:1):null});save();render()}
async function addPhoto(){let f=document.getElementById('photoInput').files[0];if(!f)return alert('Choose a photo.');if(f.size>8e6)return alert('Choose a photo under 8 MB.');let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});state.photos.push({id:uid(),at:iso(),data});await save();render()}
function removePhoto(id){if(confirm('Delete this photo permanently?')){state.photos=state.photos.filter(p=>p.id!==id);save();render()}}
function addRecovery(){let x={id:uid(),at:iso(),energy:num(document.getElementById('energy').value),sleep:num(document.getElementById('sleep').value),soreness:num(document.getElementById('soreness').value)};state.recovery.push(x);save();render()}
function recoveryAdvice(x){return x.energy<=2||x.sleep<=2||x.soreness>=4?'Consider an easier session or rest today. Listen to your body.':'Your check-in looks reasonable; adjust effort to how you feel.'}
function addNutrition(){let x={id:uid(),date:day(),protein:num(document.getElementById('protein').value),water:num(document.getElementById('water').value),habit:document.getElementById('habit').checked};state.nutrition=state.nutrition.filter(y=>y.date!==x.date);state.nutrition.push(x);save();alert('Saved today’s nutrition and habits.')}
function deleteSession(id){if(confirm('Delete this completed workout permanently?')){state.sessions=state.sessions.filter(s=>s.id!==id);save();render()}}
function settings(){let p=state.profile;return `<div class="card"><h2>Preferences</h2><label>Display name (optional)<input id="displayName" value="${esc(p.name||'')}"></label><label>Units<select id="units"><option value="lb" ${p.units==='lb'?'selected':''}>Pounds / miles</option><option value="kg" ${p.units==='kg'?'selected':''}>Kilograms / km</option></select></label><label>Theme<select id="theme"><option value="dark" ${p.theme==='dark'?'selected':''}>Dark</option><option value="light" ${p.theme==='light'?'selected':''}>Light</option></select></label><label>Experience<select id="level">${['beginner','intermediate','advanced'].map(x=>`<option ${p.level===x?'selected':''}>${x}</option>`).join('')}</select></label><h3>Goals</h3>${checkboxes('settingsGoals',[['fatloss','Fat loss'],['muscle','Muscle'],['strength','Strength'],['endurance','Endurance'],['mobility','Mobility'],['general','General fitness']],p.goals)}<h3>Equipment</h3>${checkboxes('settingsGear',[['bodyweight','Bodyweight'],['dumbbells','Dumbbells'],['bands','Bands'],['barbell','Barbell'],['machines','Machines'],['cables','Cables'],['bike','Bike'],['pool','Pool'],['rower','Rower']],p.gear)}<button class="primary" onclick="saveSettings()">Save preferences</button></div><div class="card"><h2>Backups & privacy</h2><p class="muted">Data is stored locally in this browser. Clearing site data or uninstalling may erase it. Export backups regularly. No accounts, trackers, or automatic syncing.</p><div class="row"><button class="primary" onclick="exportBackup()">Export all data</button><label style="margin:0">Import JSON backup<input id="importFile" type="file" accept="application/json,.json" onchange="importBackup(event)"></label></div><p class="muted tiny">Import replaces current data after confirmation. Save an export first.</p><button onclick="importLegacy()">Import earlier IronTrack data</button><label>Import older V2–V4 JSON backup<input type="file" accept=".json,application/json" onchange="importOldFile(event)"></label><button class="danger" onclick="clearData()">Erase all local data</button></div><div class="card"><h2>About</h2><p>Iron Forge Labs V8.3. Free and offline-capable after the first successful load. Exercise information is general guidance, not individualized medical advice.</p></div>`}
function saveSettings(){let p=state.profile;p.name=document.getElementById('displayName').value;p.units=document.getElementById('units').value;p.theme=document.getElementById('theme').value;p.level=document.getElementById('level').value;p.goals=selected('settingsGoals');p.gear=selected('settingsGear');save();render()}
function exportBackup(){let blob=new Blob([JSON.stringify({...state,exportedAt:iso()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PoorMan-Companion-V7-backup-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validate(x){return x&&[5,6].includes(x.schemaVersion)&&x.profile&&Array.isArray(x.sessions)&&Array.isArray(x.body)&&Array.isArray(x.photos)&&Array.isArray(x.nutrition)&&Array.isArray(x.recovery)}
async function importBackup(ev){let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!validate(x))throw Error('Not a valid V5/V6 backup. For older versions use legacy import.');if(x.photos.some(p=>typeof p.data!=='string'||!/^data:image\/(png|jpeg|webp|gif);base64,/.test(p.data)))throw Error('Invalid photo data.');if(!confirm('Replace ALL current local data with this backup? Export your current data first.'))return;state={...fresh(),...x,schemaVersion:6};await save();go('Today')}catch(e){alert('Import failed: '+e.message)}finally{ev.target.value=''}}
async function importOldFile(ev){let f=ev.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.workouts)||!Array.isArray(x.weights))throw Error('Not a supported V2–V4 backup.');if(!confirm('Import older workouts and weights into V5? Existing V5 data stays saved.'))return;let key='irontrack_import_temp';localStorage.setItem(key,JSON.stringify(x));importLegacy();localStorage.removeItem(key)}catch(e){alert(e.message)}finally{ev.target.value=''}}
function clearData(){if(confirm('Erase ALL PoorMan Companion data on this browser? This cannot be undone without a backup.')&&confirm('Final confirmation: permanently erase local fitness records?')){state=fresh();save();go('Today')}}
function findLegacy(){let matches=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(/irontrack/i.test(k)&&!k.includes('v5')){try{let v=JSON.parse(localStorage.getItem(k));if(v&&typeof v==='object'&&(Array.isArray(v.workouts)||Array.isArray(v.weights)||Array.isArray(v.customRoutines)||Array.isArray(v.history)))matches.push({key:k,data:v})}catch{}}}return matches}
function importLegacy(){let m=findLegacy();if(!m.length)return alert('No previous IronTrack data found in this browser. You can still use a V4 backup file after conversion.');let chosen=m.find(x=>x.key==='irontrack_import_temp')||m[0];let old=chosen.data;if(!confirm('Found older data under '+chosen.key+'. Import workouts and weights? Existing V5 data will be kept.'))return;let imported=0;let workouts=Array.isArray(old.workouts)?old.workouts:Array.isArray(old.history)?old.history:[];workouts.forEach(w=>{let id='legacy-'+String(w.id||uid());if(state.sessions.some(s=>s.id===id))return;state.sessions.push({id,name:'Imported workout '+String(w.day??''),startedAt:w.date||iso(),endedAt:w.date||iso(),status:'done',durationMinutes:0,exercises:(Array.isArray(w.entries)?w.entries:[]).map(e=>({id:EX.find(x=>x.name.toLowerCase()===String(e.name).toLowerCase())?.id||String(e.name),sets:(Array.isArray(e.sets)?e.sets:[]).map(z=>({weight:z.weight,reps:z.reps,done:z.done}))}))});imported++});(old.weights||[]).forEach(w=>{let id='legacy-weight-'+w.date;if(!state.body.some(x=>x.id===id))state.body.push({id,at:w.date,weightKg:num(w.value)/(old.units==='kg'?1:2.20462262)})});state.legacyImported=true;save();alert('Imported '+imported+' older workouts. Export a V5 backup now.');go('Progress')}
async function init(){try{db=await openDB();state=await readDB()||fresh();if(state.schemaVersion===5){state.schemaVersion=6;state.goals ||= {sessions:3,minutes:150};await save()}if(!validate(state))state={...fresh(),...state,schemaVersion:6,sessions:Array.isArray(state.sessions)?state.sessions:[],body:Array.isArray(state.body)?state.body:[],photos:Array.isArray(state.photos)?state.photos:[],nutrition:Array.isArray(state.nutrition)?state.nutrition:[],recovery:Array.isArray(state.recovery)?state.recovery:[]};nav();render();if(tab==='Explore')filterExplore();}catch(e){document.getElementById('main').innerHTML='<div class="card">Storage is unavailable. Please enable site storage in your browser. '+esc(e.message)+'</div>'}if(num(localStorage.getItem('pmc-rest-until'))>Date.now())timer=setInterval(updateTimerDisplay,1000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});document.getElementById('offline').textContent=navigator.onLine?'Online':'Offline';window.addEventListener('online',()=>document.getElementById('offline').textContent='Online');window.addEventListener('offline',()=>document.getElementById('offline').textContent='Offline')}

// V6: dedicated activity logging, weekly summary, adjustable goals and achievements.
const ACTIVITY_TYPES=[['walk','Walking'],['run','Running'],['cycle','Cycling'],['swim','Swimming'],['row','Rowing'],['elliptical','Elliptical'],['hike','Hiking'],['stretch','Stretching'],['mobility','Mobility'],['yoga','Yoga'],['sport','Sports'],['manual','Other activity']];
function pickActivity(kind){let el=document.querySelector('select[name="kind"]');if(!el)return;el.value=kind;document.querySelectorAll('.activity-tile').forEach(b=>{let active=b.dataset.kind===kind;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});document.getElementById('activity-form').scrollIntoView({behavior:'smooth',block:'start'})}
function activities(){let recent=state.sessions.filter(s=>s.type==='cardio'||s.type==='activity'||s.exercises?.some(x=>E(x.id).type!=='strength')).slice(-8).reverse(),icons={walk:'🚶',run:'🏃',cycle:'🚴',swim:'🏊',row:'🚣',elliptical:'⚡',hike:'🥾',stretch:'🧘',mobility:'🤸',yoga:'🌿',sport:'🏀',manual:'✨'};return `<div class="feature-hero card"><div class="eyebrow">MOVE YOUR WAY</div><h2>Every move counts.</h2><p class="muted">Choose an activity below. You don't need fancy equipment to make progress.</p></div><div class="section-heading"><h2>What did you do today?</h2></div><div class="activity-grid">${ACTIVITY_TYPES.map(([v,n])=>`<button class="activity-tile ${v==='walk'?'selected':''}" data-kind="${v}" aria-pressed="${v==='walk'}" onclick="pickActivity('${v}')"><span>${icons[v]||'✨'}</span><small>${n}</small></button>`).join('')}</div><div class="card activity-form" id="activity-form"><div class="eyebrow">QUICK LOG</div><h2>Record your activity</h2><form onsubmit="saveActivity(event)"><div class="grid"><label>Activity<select name="kind" onchange="document.querySelectorAll('.activity-tile').forEach(b=>{let a=b.dataset.kind===this.value;b.classList.toggle('selected',a);b.setAttribute('aria-pressed',String(a))})">${ACTIVITY_TYPES.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</select></label><label>Date<input type="date" name="date" value="${day()}" required></label><label>Minutes<input name="minutes" type="number" min="1" max="1440" required placeholder="30"></label><label>Distance (${state.profile.units==='lb'?'miles':'km'})<input name="distance" type="number" min="0" step="0.01" placeholder="Optional"></label><label>Effort<select name="effort"><option value="easy">Easy</option><option value="moderate" selected>Moderate</option><option value="hard">Hard</option></select></label></div><label>Notes (optional)<textarea name="notes" maxlength="500" placeholder="How did it feel?"></textarea></label><button class="primary" type="submit">✓ Save activity</button></form></div><div class="section-heading"><h2>Recent movement</h2></div><div class="session-grid">${recent.map(s=>`<div class="session-card"><span class="session-icon">${icons[s.exercises?.[0]?.id]||'🏅'}</span><h3>${esc(s.name)}</h3><p class="muted tiny">${new Date(s.startedAt).toLocaleDateString()}</p><div class="metric">${num(s.durationMinutes)} <span class="tiny muted">min</span></div>${s.exercises?.[0]?.distance?`<p class="muted tiny">${esc(s.exercises[0].distance)} ${state.profile.units==='lb'?'mi':'km'}</p>`:''}</div>`).join('')||'<div class="card"><p class="muted">Your activities will appear here after you save your first one.</p></div>'}</div>`}

function saveActivity(ev){ev.preventDefault();let f=ev.target,kind=f.elements.kind.value,minutes=Number(f.elements.minutes.value),distance=f.elements.distance.value===''?null:Number(f.elements.distance.value);if(!Number.isFinite(minutes)||minutes<1||minutes>1440||distance!==null&&(!Number.isFinite(distance)||distance<0))return alert('Check your minutes and distance.');let d=f.elements.date.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!Number.isFinite(new Date(d+'T12:00:00').getTime()))return alert('Choose a valid date.');let label=ACTIVITY_TYPES.find(x=>x[0]===kind)?.[1]||'Activity';state.sessions.push({id:uid(),name:label,type:'activity',startedAt:d+'T12:00:00',endedAt:d+'T12:00:00',status:'done',durationMinutes:minutes,notes:f.elements.notes.value,effort:f.elements.effort.value,exercises:[{id:kind,minutes,distance:distance??'',sets:[]}]});save();render()}
function weekStats(){let completed=state.sessions.filter(s=>s.status==='done'&&new Date(s.startedAt)>=thisWeek());return {count:completed.length,minutes:completed.reduce((a,s)=>a+num(s.durationMinutes),0),distance:completed.reduce((a,s)=>a+(s.exercises||[]).reduce((b,x)=>b+num(x.distance),0),0)}}
function goalCard(){let g=state.goals||{sessions:3,minutes:150};let w=weekStats();return `<div class="card"><div class="eyebrow">THIS WEEK</div><h2>Small steps. Real progress.</h2><div class="grid"><div><div class="metric">${w.count}<span class="muted"> / ${g.sessions}</span></div><p class="muted tiny">Sessions</p><div class="bar"><span style="width:${Math.min(100,w.count/g.sessions*100)}%"></span></div></div><div><div class="metric">${w.minutes}<span class="muted"> / ${g.minutes}</span></div><p class="muted tiny">Active minutes</p><div class="bar"><span style="width:${Math.min(100,w.minutes/g.minutes*100)}%"></span></div></div></div><p class="muted tiny">${w.distance.toFixed(1)} ${state.profile.units==='lb'?'mi':'km'} logged this week · Every activity counts.</p><button onclick="go('Activities')">+ Log activity</button></div>`}
function weeklySummary(){let w=weekStats(),prevStart=new Date(thisWeek());prevStart.setDate(prevStart.getDate()-7);let prev=state.sessions.filter(s=>s.status==='done'&&new Date(s.startedAt)>=prevStart&&new Date(s.startedAt)<thisWeek());let prevMin=prev.reduce((a,s)=>a+num(s.durationMinutes),0);return `<div class="card"><div class="eyebrow">WEEKLY REVIEW</div><h2>Your week in motion</h2><div class="grid"><div><div class="metric">${w.count}</div><div class="muted tiny">Sessions</div></div><div><div class="metric">${w.minutes}</div><div class="muted tiny">Active minutes</div></div><div><div class="metric">${w.distance.toFixed(1)}</div><div class="muted tiny">${state.profile.units==='lb'?'Miles':'Kilometers'}</div></div></div><p class="muted">${w.minutes>prevMin?'More active minutes than last week. Nice work!':w.minutes===prevMin?'Steady progress. Every move counts.':'Every week is a fresh start. Move at your pace.'}</p></div>`}
function achievements(){let count=state.sessions.filter(s=>s.status==='done').length;let mins=state.sessions.reduce((a,s)=>a+num(s.durationMinutes),0);let milestones=[[count>=1,'First step'],[count>=5,'5 sessions'],[count>=25,'25 sessions'],[mins>=60,'60 active minutes'],[mins>=600,'600 active minutes'],[state.body.length>=1,'First measurement']];return `<div class="card"><h2>Achievements</h2><div class="row">${milestones.map(([ok,name])=>`<span class="pill" style="opacity:${ok?1:.4}">${ok?'★':'☆'} ${name}</span>`).join('')}</div><p class="muted tiny">Achievements never expire. Missed days don't erase your progress.</p></div>`}
function saveGoals(ev){ev.preventDefault();let f=ev.target,s=Number(f.elements.sessions.value),m=Number(f.elements.minutes.value);if(!Number.isInteger(s)||s<1||s>14||!Number.isInteger(m)||m<10||m>3000)return alert('Choose realistic goal values.');state.goals={sessions:s,minutes:m};save();render()}
const v6Today=today;today=function(){return goalCard()+v6Today()+weeklySummary()+achievements()};
const v6Progress=progress;progress=function(){return weeklySummary()+v6Progress()};
const v6Settings=settings;settings=function(){let g=state.goals||{sessions:3,minutes:150};return `<div class="card"><h2>Weekly goals</h2><p class="muted">Set goals that work for your life. Adjust anytime.</p><form onsubmit="saveGoals(event)"><div class="grid"><label>Sessions per week<input type="number" name="sessions" min="1" max="14" value="${g.sessions}" required></label><label>Active minutes per week<input type="number" name="minutes" min="10" max="3000" value="${g.minutes}" required></label></div><button class="primary" type="submit">Save goals</button></form></div>`+v6Settings()};



// V6.7 exercise education: original offline diagrams and plain-language steps.
const GUIDE_STEPS={"pushup":["Place hands slightly wider than shoulders and extend your legs behind you.","Brace your middle and keep your head, hips, and heels in one line.","Bend elbows to lower with control, then push the floor away."],"inclinepush":["Place hands on a stable raised surface that will not slide.","Walk feet back until your body forms a straight line.","Lower your chest toward the surface, then press away."],"squat":["Stand with feet roughly shoulder-width apart.","Bend hips and knees as if sitting in a chair, keeping feet grounded.","Stand back up smoothly through your feet."],"chair":["Stand in front of a stable chair with feet planted.","Sit down slowly without dropping into the seat.","Lean forward slightly and stand up with control."],"step":["Use a low, stable step and stand tall in front of it.","Step up with one foot and push through that foot to rise.","Step down carefully and repeat, alternating sides."],"bridge":["Lie on your back with knees bent and feet flat.","Brace your middle and squeeze your glutes to lift hips.","Pause briefly, then lower your hips slowly."],"plank":["Place forearms on the floor under your shoulders.","Extend legs and brace your stomach and glutes.","Hold a straight body line while breathing normally."],"deadbug":["Lie on your back with arms up and knees bent above hips.","Keep your lower back gently supported as you extend opposite arm and leg.","Return to start and alternate sides slowly."],"dbpress":["Lie on the floor with knees bent and a dumbbell in each hand.","Start with elbows resting gently near the floor and wrists straight.","Press weights upward, then lower until upper arms lightly touch the floor."],"dbrow":["Support one hand on a stable bench or surface and hinge at the hips.","Let the dumbbell hang below your shoulder with a steady back.","Pull your elbow toward your hip without twisting, then lower slowly."],"dbshoulder":["Stand or sit tall with dumbbells near shoulder height.","Brace your middle and press upward through a comfortable range.","Lower slowly to shoulder level without leaning backward."],"dbhinge":["Stand tall holding dumbbells in front of your thighs.","Keep knees soft and push hips backward with weights close to legs.","Stop before your back rounds, then drive hips forward to stand."],"dbcurl":["Stand tall with dumbbells by your sides.","Keep elbows near your ribs and curl weights toward shoulders.","Lower slowly without swinging your body."],"dbtri":["Hold a light dumbbell securely and position arms comfortably.","Bend at the elbows to lower the weight under control.","Straighten elbows without jerking or forcing the joint."],"dblateral":["Stand tall with light dumbbells beside your hips.","With elbows slightly bent, raise arms out to a comfortable height.","Lower slowly without shrugging or swinging."],"bandrow":["Anchor the resistance band securely at torso height.","Step back until the band has light tension and stand tall.","Pull elbows back toward ribs, then return slowly."],"bandpress":["Secure the band behind you at chest height.","Stand in a stable stance with hands near your chest.","Press forward without arching your back, then return slowly."],"bench":["Lie on a bench with feet planted and eyes below the bar.","Use safeties or a spotter and grip the bar evenly.","Lower to a controlled position near the chest, then press upward."],"latpull":["Sit securely with thighs supported and grip the bar.","Pull elbows down toward your sides as the bar moves toward upper chest.","Return overhead slowly without swinging your torso."],"legpress":["Sit with your back supported and feet planted on the platform.","Bend knees through a comfortable range while keeping hips down.","Press the platform away without forcefully locking knees."],"cablerow":["Sit tall with feet braced and shoulders relaxed.","Pull the handle toward your lower ribs with elbows close.","Extend arms slowly without rounding your back."]};
function guideSteps(e){return GUIDE_STEPS[e.id]|| (e.type==='cardio'?['Start at a comfortable pace for your current ability.','Maintain a pace where you can stay in control of your breathing.','Slow down or stop if you feel unwell, and build up gradually.']:e.type==='mobility'?['Move into a comfortable position without forcing your joints.','Breathe steadily while moving through a gentle range.','Stop if the movement causes pain; never bounce into a stretch.']:['Set up with a stable stance and light resistance.','Perform the movement slowly using a comfortable range.','Pause and reset if your form changes.'])}
function closeGuide(){document.getElementById('guideOverlay')?.remove();document.getElementById('exercise-guide-overlay')?.remove()}

// Beginner-friendly guided exercise swaps (V6)
let swapContext=null,swapReason='equipment',swapSelected=null,swapSearch='';
function swap(i){openSwap('active',i)}
function openSwap(mode,index){
 if(mode==='active'&&!state.active)return;
 if(mode==='plan'&&!state.plan?.sessions[index])return;
 swapContext={mode,index,exerciseIndex:mode==='plan'?0:index};swapReason='equipment';swapSelected=null;swapSearch='';drawSwap();
}
function swapExerciseId(){let c=swapContext;if(!c)return null;return c.mode==='active'?state.active.exercises[c.index]?.id:state.plan.sessions[c.index]?.exercises[c.exerciseIndex]}
function swapCandidates(){let old=E(swapExerciseId()),profile=state.profile||{},reasons={equipment:1,difficulty:1,discomfort:1,preference:1};if(!reasons[swapReason])swapReason='equipment';let all=EX.filter(e=>e.id!==old.id&&e.type===old.type&&!((profile.exclusions||[]).includes(e.id)));
 return all.map(e=>{let score=0;if(e.muscle===old.muscle)score+=100;else if(e.type==='strength')score-=40;if(gearAllowed(e))score+=45;else score-=90;if(e.level==='Beginner')score+=profile.level==='beginner'?22:6;if(swapReason==='difficulty'&&e.level==='Beginner')score+=35;if(swapReason==='equipment'&&gearAllowed(e))score+=30;if(swapReason==='discomfort'&&e.id===old.id)score-=100;return {...e,score,available:gearAllowed(e)}}).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
}
function drawSwap(){let c=swapContext;if(!c)return;let old=E(swapExerciseId()),all=swapCandidates(),matching=all.filter(e=>e.name.toLowerCase().includes(swapSearch.toLowerCase())||e.muscle.toLowerCase().includes(swapSearch.toLowerCase()));let top=matching.filter(e=>e.available&&e.muscle===old.muscle).slice(0,3);let rest=matching.filter(e=>!top.some(t=>t.id===e.id));let item=e=>`<button type="button" class="swap-option ${swapSelected===e.id?'picked':''}" onclick="selectSwap('${e.id}')"><span><b>${esc(e.name)}</b><small>${esc(e.muscle)} · ${esc(e.gear)} · ${esc(e.level)}${e.available?'':' · Equipment not selected'}</small><small>${esc(e.instructions)}</small></span><span aria-hidden="true">${swapSelected===e.id?'✓':'›'}</span></button>`;
 let existing=document.getElementById('swapOverlay');if(existing)existing.remove();let overlay=document.createElement('div');overlay.id='swapOverlay';overlay.className='swap-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Replace exercise');overlay.innerHTML=`<section class="swap-panel"><div class="row between"><h2>Replace ${esc(old.name)}</h2><button onclick="closeSwap()" aria-label="Close replacements">✕</button></div><p class="muted">We'll suggest similar exercises that work with your equipment. You can also browse other options.</p><label>Why are you replacing it?<select id="swapReason" onchange="swapReason=this.value;swapSelected=null;drawSwap()"><option value="equipment" ${swapReason==='equipment'?'selected':''}>I don't have the equipment</option><option value="difficulty" ${swapReason==='difficulty'?'selected':''}>It's too difficult</option><option value="discomfort" ${swapReason==='discomfort'?'selected':''}>It feels uncomfortable</option><option value="preference" ${swapReason==='preference'?'selected':''}>I prefer something else</option></select></label>${swapReason==='discomfort'?'<p class="notice" style="padding:10px;border-radius:8px">If an exercise causes pain, stop. A substitution is not medical advice; seek qualified guidance for persistent pain.</p>':''}<label>Find another exercise<input id="swapSearch" placeholder="Search by name or muscle" value="${esc(swapSearch)}" oninput="swapSearch=this.value;drawSwap()"></label><h3>Recommended for you</h3>${top.length?top.map(item).join(''):'<p class="muted">No close matches with your selected equipment. Browse other options below.</p>'}<details><summary>Browse all other exercises (${rest.length})</summary>${rest.map(item).join('')||'<p>No more matches.</p>'}</details><div class="row"><button class="primary" ${!swapSelected?'disabled':''} onclick="confirmSwap()">Use selected exercise</button><button onclick="closeSwap()">Cancel</button></div><p class="muted tiny">Swapping a logged exercise may reset its unfinished sets. Completed sets are protected by a confirmation.</p></section>`;document.body.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)closeSwap()});}
function selectSwap(id){swapSelected=id;drawSwap()}
function closeSwap(){document.getElementById('swapOverlay')?.remove();swapContext=null}
function confirmSwap(){let c=swapContext,chosen=EX.find(e=>e.id===swapSelected);if(!c||!chosen)return;if(!gearAllowed(chosen)&&!confirm('This exercise needs equipment you did not select. Continue anyway?'))return;
 if(c.mode==='active'){let old=state.active.exercises[c.index];if(!old)return;if(old.sets?.some(s=>s.done)&&!confirm('This exercise has completed sets. Replacing it will remove those sets from this unfinished workout. Continue?'))return;let oldDose={sets:old.targetSets||state.active.targetSets||recommendedDose().sets,reps:old.targetReps||state.active.targetReps||recommendedDose().reps};state.active.exercises[c.index]={id:chosen.id,targetSets:oldDose.sets,targetReps:oldDose.reps,sets:chosen.type==='strength'?Array.from({length:oldDose.sets},()=>({weight:'',reps:'',done:false})):[],minutes:'',distance:''};}
 else {state.plan.sessions[c.index].exercises[c.exerciseIndex]=chosen.id;}
 closeSwap();save();render();}
function editPlanSession(i){let s=state.plan?.sessions[i];if(!s)return;let buttons=s.exercises.map((id,j)=>`<div class="listitem"><b>${esc(E(id).name)}</b><button onclick="planSwapIndex(${i},${j})">Suggest replacement</button></div>`).join('');document.getElementById('main').insertAdjacentHTML('afterbegin',`<div class="card" id="planEditCard"><div class="row between"><h2>Edit ${esc(s.name)}</h2><button onclick="document.getElementById('planEditCard').remove()">Close</button></div><p class="muted">Tap an exercise to see beginner-friendly replacements.</p>${buttons}</div>`);window.scrollTo(0,0)}
function planSwapIndex(i,j){openSwap('plan',i);swapContext.exerciseIndex=j;drawSwap()}


// V7 personalized journey. Existing IndexedDB records are preserved.
let journeyPreview=null;
const oldNav=nav;
nav=function(){oldNav();const bar=document.getElementById('nav');if(bar&&!bar.querySelector('[data-journey]')){let b=document.createElement('button');b.dataset.journey='1';b.className=tab==='Journey'?'active':'';b.innerHTML='<span class="navicon">◎</span><span>Journey</span>';b.onclick=()=>go('Journey');bar.insertBefore(b,bar.children[1]);}};
const oldRender=render;
render=function(){if(tab==='Journey'){document.body.classList.toggle('light',state.profile.theme==='light');document.getElementById('main').innerHTML=journeyView();return;}oldRender();};
const oldToday=today;
today=function(){let j=state.journey;return `<div class="journey-hero"><div class="eyebrow">YOUR PERSONAL FITNESS PLAN</div><h2>${j?'Keep building your journey':'Your goals. Your plan.'}</h2><p class="muted">${j?'Your personal schedule is ready whenever you are.':'Tell us your starting point and we’ll suggest a practical workout routine.'}</p><button class="primary" onclick="go('Journey')">${j?'◎ View my fitness journey':'◎ Build my fitness journey'}</button></div>`+oldToday()};
function journeyView(){let j=state.journey||{},p=state.profile,unit=p.units==='kg'?'kg':'lb';return `<div class="feature-hero card"><div class="eyebrow">MY FITNESS JOURNEY · V7</div><h2>Fitness that fits your life.</h2><p class="muted">Build a beginner-friendly plan around your goals, experience, available equipment and time. Height and weight alone never decide workout intensity.</p></div>${j.accepted?journeyCurrent(j):''}<div class="card journey-form"><h2>${j.accepted?'Adjust your journey':'Create your personal plan'}</h2><form onsubmit="previewJourney(event)"><div class="grid"><label>Height (feet)<input name="feet" type="number" min="3" max="7" step="1" required value="${j.feet||5}"></label><label>Extra inches<input name="inches" type="number" min="0" max="11" step="1" required value="${j.inches??8}"></label><label>Current weight (${unit})<input name="current" type="number" min="60" max="1200" step="0.1" required value="${j.current||''}" placeholder="Optional until planning"></label><label>Goal weight (${unit})<input name="goal" type="number" min="60" max="1200" step="0.1" required value="${j.goal||''}"></label><label>Primary goal<select name="focus">${[['loss','Lose weight'],['maintain','Maintain weight'],['muscle','Build muscle'],['active','Move more']].map(([v,t])=>`<option value="${v}" ${j.focus===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Experience<select name="level">${['beginner','intermediate','advanced'].map(v=>`<option ${((j.level||p.level)===v)?'selected':''}>${v}</option>`).join('')}</select></label><label>Equipment<select name="equipment">${[['bodyweight','No equipment'],['dumbbells','Dumbbells at home'],['bands','Resistance bands'],['gym','Full gym']].map(([v,t])=>`<option value="${v}" ${j.equipment===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Workout days per week<select name="days">${[2,3,4,5,6].map(v=>`<option value="${v}" ${v===(j.days||3)?'selected':''}>${v}</option>`).join('')}</select></label><label>Minutes per workout<select name="minutes">${[15,20,30,45,60].map(v=>`<option value="${v}" ${v===(j.minutes||30)?'selected':''}>${v} minutes</option>`).join('')}</select></label><label>Cardio preference<select name="cardio"><option value="walk">Walking</option><option value="cycle" ${j.cardio==='cycle'?'selected':''}>Cycling</option><option value="none" ${j.cardio==='none'?'selected':''}>No scheduled cardio</option></select></label></div><label>Anything you want to avoid? (optional)<input name="limitations" maxlength="180" value="${esc(j.limitations||'')}" placeholder="e.g. jumping, overhead lifting"></label><p class="journey-info">The app cannot assess injuries or medical suitability. You can swap exercises and adjust the plan. For pain or medical restrictions, seek qualified guidance.</p><button class="primary" type="submit">✦ Preview my personalized plan</button></form></div><div id="journey-preview"></div>`}
function journeyExercises(j){let e=j.equipment,begin=j.level==='beginner',strength=e==='gym'?['bench','cablerow','legpress','latpull','bridge','plank']:e==='dumbbells'?['dbpress','dbrow','chair','dbhinge','dbshoulder','deadbug']:e==='bands'?['bandpress','bandrow','chair','bridge','plank','step']:['inclinepush','chair','bridge','deadbug','step','plank'];if(begin)strength=strength.filter(x=>x!=='dbshoulder');return strength.filter(x=>!state.profile.exclusions.includes(x));}
function buildJourneyPlan(j){let strength=journeyExercises(j),cardio=j.cardio==='none'?null:j.cardio,weekdaysFor={2:[1,4],3:[1,3,5],4:[1,2,4,6],5:[1,2,3,5,6],6:[1,2,3,4,5,6]}[j.days];let sessions=weekdaysFor.map((wd,i)=>{let isCardio=cardio&&i===1&&j.days>=3;let exercises=isCardio?[cardio]:strength.filter((_,k)=>((k+i)%3)!==2).slice(0,j.level==='beginner'?4:5);return {id:uid(),weekday:wd,name:isCardio?'Cardio & recovery':'Full Body '+(i+1),exercises}});return {id:uid(),template:'journey',name:'My Fitness Journey',weekdays:[...weekdaysFor],sessions,createdAt:iso()}}
function previewJourney(ev){ev.preventDefault();let f=ev.target,j={feet:Number(f.feet.value),inches:Number(f.inches.value),current:Number(f.current.value),goal:Number(f.goal.value),focus:f.focus.value,level:f.level.value,equipment:f.equipment.value,days:Number(f.days.value),minutes:Number(f.minutes.value),cardio:f.cardio.value,limitations:f.limitations.value.trim()};if(!Number.isFinite(j.current)||!Number.isFinite(j.goal)||j.current<=0||j.goal<=0)return alert('Enter valid current and goal weights.');if(j.focus==='loss'&&j.goal>=j.current)return alert('For a weight-loss goal, enter a goal weight below your current weight, or choose another goal.');if(j.goal<j.current*.5||j.goal>j.current*1.6)return alert('This goal is a large change. Consider a smaller initial milestone and review your target with a healthcare professional.');journeyPreview={...j,plan:buildJourneyPlan(j)};document.getElementById('journey-preview').innerHTML=journeyPreviewHtml(journeyPreview);document.getElementById('journey-preview').scrollIntoView({behavior:'smooth',block:'start'})}
function journeyPreviewHtml(j){let unit=state.profile.units==='kg'?'kg':'lb',dose=j.level==='beginner'?{sets:2,reps:'8–12'}:{sets:3,reps:'8–12'};return `<div class="card journey-plan"><div class="eyebrow">PREVIEW · NOTHING SAVED YET</div><h2>Your custom starting plan</h2><div class="journey-summary"><div><strong>${j.current}</strong><small>Current ${unit}</small></div><div><strong>${j.goal}</strong><small>Goal ${unit}</small></div><div><strong>${j.days}</strong><small>Days / week</small></div></div><p class="muted">${j.focus==='loss'?'Strength training helps preserve muscle while you work toward your goal. Weight change also depends on nutrition and other factors.':'A practical mix of movement and recovery, adjustable as you improve.'}</p><div class="session-grid">${j.plan.sessions.map(s=>`<div class="session-card"><span class="section-tag">${weekdays[s.weekday]}</span><h3>${esc(s.name)}</h3><p class="muted tiny">${j.minutes} minutes · ${s.exercises.length} activities</p>${s.name.startsWith('Cardio')?'':`<p class="program-note tiny">Each strength exercise: ${dose.sets} sets × ${dose.reps} reps</p>`}${s.exercises.map(id=>`<div class="tiny" style="margin:7px 0">✓ ${esc(E(id).name)}</div>`).join('')}</div>`).join('')}</div><p class="journey-info">Suggested starting point, not a guaranteed weight-loss timeline. Review and swap exercises anytime. If you listed limitations, please check each movement yourself before starting.</p><button class="primary" onclick="acceptJourney()">✓ Use this plan</button> <button onclick="document.querySelector('.journey-form').scrollIntoView({behavior:'smooth'})">Edit answers</button></div>`}
function acceptJourney(){let j=journeyPreview;if(!j)return; if(state.plan&&!confirm('Replace your current workout schedule? Your completed workouts and progress will be kept.'))return;state.journey={...j,accepted:true,createdAt:iso()};state.plan=j.plan;state.profile.level=j.level;state.profile.minutes=j.minutes;state.profile.days=[...j.plan.weekdays];state.profile.gear=j.equipment==='gym'?['bodyweight','dumbbells','barbell','machines','cables']:j.equipment==='bodyweight'?['bodyweight']:['bodyweight',j.equipment];state.profile.complete=true;state.profile.goals=j.focus==='loss'?['fatloss']:j.focus==='muscle'?['muscle']:['general'];if(!state.body.some(x=>x.source==='journey-start'))state.body.push({id:uid(),at:iso(),weightKg:j.current/(state.profile.units==='lb'?2.20462262:1),source:'journey-start'});save();journeyPreview=null;go('Journey')}
function journeyCurrent(j){let unit=state.profile.units==='kg'?'kg':'lb',latest=state.body.filter(x=>x.weightKg!=null).slice(-1)[0],current=latest?(latest.weightKg*(unit==='lb'?2.20462262:1)).toFixed(1):j.current,delta=(j.current-j.goal),remaining=(Number(current)-j.goal);return `<div class="card"><div class="eyebrow">YOUR ACTIVE JOURNEY</div><h2>${esc(state.plan?.name||'My Fitness Journey')}</h2><div class="journey-summary"><div><strong>${esc(current)}</strong><small>Latest ${unit}</small></div><div><strong>${esc(j.goal)}</strong><small>Target ${unit}</small></div><div><strong>${j.days}</strong><small>Days / week</small></div></div><p class="muted">${j.focus==='loss'&&delta>0?`${Math.max(0,Math.round((1-remaining/delta)*100))}% of the way from your starting weight toward your goal. `:''}Keep showing up at your own pace.</p><button class="primary" onclick="go('Plan')">See my workouts</button> <button onclick="go('Progress')">Log weight</button></div>`}
function openGuide(id){let e=E(id);closeGuide();closeSwap();let steps=GUIDE_STEPS[id];let panel=document.createElement('div');panel.id='exercise-guide-overlay';panel.className='swap-overlay';panel.setAttribute('role','presentation');panel.innerHTML=`<section class="swap-panel movement-panel" role="dialog" aria-modal="true" aria-label="${esc(e.name)} exercise tutorial"><div class="guide-head"><div><div class="eyebrow">EXERCISE TUTORIAL</div><h2>${esc(e.name)}</h2><p class="muted">${esc(e.muscle)} · ${esc(e.gear)} · ${esc(e.level)}</p></div><button type="button" onclick="closeGuide()" aria-label="Close exercise guide">✕ Close</button></div><figure class="real-demo-main"><img src="exercise-${id}.webp" alt="AI-generated two-position demonstration of ${esc(e.name)}"><figcaption>Setup on the left · controlled movement on the right</figcaption></figure><h3>Follow these steps</h3><div class="movement-steps">${(steps||[e.instructions]).map((st,i)=>`<div class="movement-step"><strong>${i+1}</strong><p>${esc(st)}</p></div>`).join('')}</div><div class="movement-advice"><div><b>✓ Key tips</b><p>Move with control, use manageable resistance and breathe steadily.</p></div><div><b>✕ Avoid</b><p>Rushing repetitions, ignoring pain or using weight you cannot control.</p></div></div><button type="button" class="primary" onclick="closeGuide()">Got it</button></section>`;document.body.appendChild(panel);panel.addEventListener('click',ev=>{if(ev.target===panel)closeGuide()});panel.querySelector('button')?.focus();}

// All overlays share the same dismissal path, including the Escape key.
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeGuide();closeSwap()}});

function guideThumb(id){return `<img src="exercise-${id}.webp" alt="AI-generated two-position form demonstration for ${esc(E(id).name)}" loading="lazy">`}
init();
</script><style>
.program-toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.program-toolbar label{font-size:.78rem}.program-toolbar select{width:100%;min-width:0}.program-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}.program-card{border:1px solid #315477;border-radius:17px;padding:16px;background:#12263c}.program-card h3{margin:8px 0}.program-card p{line-height:1.5}.program-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.program-chips span{border:1px solid #41607c;border-radius:99px;padding:4px 8px;font-size:.72rem}.program-detail-session{padding:12px;border:1px solid #355776;border-radius:13px;margin:9px 0}.program-detail-session button{margin:4px}.program-note{border-left:3px solid #49b8f2;padding:10px 14px;background:#153149;border-radius:9px}@media(max-width:550px){.program-toolbar{grid-template-columns:1fr 1fr}.program-toolbar label:first-child{grid-column:1/-1}}
</style><script src="programs_v83.js"></script></body></html>
